# Mantiene activo el proyecto gratuito de Supabase (kova-catalogo).
# Supabase pausa los proyectos del plan gratis tras 7 días sin actividad; esta tarea
# lee el catálogo público cada 3 días para que eso no pase.
# Usa solo la clave PÚBLICA (la misma de js/config.js): no necesita secretos.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 13 */3 * *'   # cada 3 días, 8:17 a. m. hora Colombia
  workflow_dispatch:           # botón "Run workflow" para probarla a mano

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer el catálogo público
        env:
          SUPABASE_URL: https://vfdpkmqncbhrauqtrnay.supabase.co
          SUPABASE_KEY: sb_publishable_oBeBITx1TCiLsVvvK0kA1g_jTXeV6hW
        run: |
          status=$(curl -sS -o body.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/products?select=id&published=eq.true&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"; cat body.json; echo
          test "$status" = "200"
